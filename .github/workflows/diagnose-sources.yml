name: Diagnose Real Data Sources

# One-off diagnostic: this sandbox's network policy blocks direct access to
# oracleselixir.com, lol.fandom.com, liquipedia.net, gol.gg, lolalytics.com,
# and ddragon.leagueoflegends.com, so we can't discover the real, current
# download URLs / API shapes for these sources from within the dev session.
# GitHub-hosted runners have normal internet access, so this workflow probes
# each candidate source and logs what it finds, purely to inform how the
# real fetchers in packages/pipeline/compstrength_pipeline/sources/ should
# be implemented. Safe to delete once that information has been gathered.

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: gol.gg matchlist -- extract game links and table structure
        run: |
          curl -sS --max-time 20 -A "Mozilla/5.0" -o /tmp/golgg_list.html "https://gol.gg/tournament/tournament-matchlist/MSI%202026/"
          echo "--- size ---"; wc -c /tmp/golgg_list.html
          echo "--- hrefs containing /game/ ---"
          grep -oE 'href="[^"]*/game/[^"]*"' /tmp/golgg_list.html | sort -u | head -20
          echo "--- hrefs containing /stats/ ---"
          grep -oE 'href="[^"]*stats[^"]*"' /tmp/golgg_list.html | sort -u | head -20
          echo "--- any href at all (sample) ---"
          grep -oE 'href="[^"]*"' /tmp/golgg_list.html | sort -u | head -40

      - name: gol.gg -- fetch one game detail / draft page
        run: |
          GAME_HREF=$(grep -oE 'href="/game/stats/[0-9]+/[^"]*"' /tmp/golgg_list.html | head -1 | sed 's/href="//;s/"$//')
          echo "First game href: $GAME_HREF"
          if [ -n "$GAME_HREF" ]; then
            BASE_ID=$(echo "$GAME_HREF" | grep -oE '/game/stats/[0-9]+/')
            echo "Base id path: $BASE_ID"
            for PAGE in "page-summary" "page-game" "page-fullstats" "page-draft"; do
              URL="https://gol.gg${BASE_ID}${PAGE}/"
              echo "=== $URL ==="
              curl -sS --max-time 20 -A "Mozilla/5.0" -o /tmp/detail_$PAGE.html -w "HTTP %{http_code} size=%{size_download}\n" "$URL"
              grep -o "<title>[^<]*</title>" /tmp/detail_$PAGE.html 2>/dev/null
              echo "--- mentions of Ban/Pick ---"
              grep -oiE '(ban|pick)[a-z0-9_ -]{0,20}' /tmp/detail_$PAGE.html 2>/dev/null | sort -u | head -15
            done
          else
            echo "No game href found -- printing raw hrefs for debugging"
            grep -oE 'href="[^"]*"' /tmp/golgg_list.html | sort -u | head -80
          fi

      - name: Leaguepedia Cargo -- corrected field casing, single request
        run: |
          sleep 3
          echo "=== tables list sanity check (Cargo__Tables) ==="
          curl -sS --max-time 20 -A "compstrength-diagnostic/1.0 (contact: github.com/Specifxx/CompStrength)" \
            "https://lol.fandom.com/api.php?action=cargoquery&format=json&tables=ScoreboardGames&fields=ScoreboardGames.GameId,ScoreboardGames.Team1,ScoreboardGames.Team2,ScoreboardGames.DateTime_UTC,ScoreboardGames.Patch&order_by=ScoreboardGames.DateTime_UTC%20DESC&limit=3" \
            | head -c 3000
          echo

      - name: Oracle Elixir downloads page -- look for JSON/script-embedded data
        run: |
          curl -sS --max-time 20 -A "Mozilla/5.0" "https://oracleselixir.com/tools/downloads" -o /tmp/downloads2.html
          echo "--- full grep for any .csv mentions ---"
          grep -oiE '[a-z0-9_/.:-]*\.csv' /tmp/downloads2.html | sort -u | head -30 || echo "none"
          echo "--- script src tags (likely a Next.js app -- data may be client-fetched) ---"
          grep -oE '<script[^>]*src="[^"]*"' /tmp/downloads2.html | sort -u | head -20
