name: Diagnose Real Data Sources

# One-off diagnostic: this sandbox's network policy blocks direct access to
# oracleselixir.com, lol.fandom.com, liquipedia.net, gol.gg, lolalytics.com,
# and ddragon.leagueoflegends.com, so we can't discover the real, current
# download URLs / API shapes for these sources from within the dev session.
# GitHub-hosted runners have normal internet access, so this workflow probes
# each candidate source and logs what it finds, purely to inform how the
# real fetchers in packages/pipeline/compstrength_pipeline/sources/ should
# be implemented. Safe to delete once that information has been gathered.

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Leaguepedia -- ScoreboardGames with clean aliases (confirmed working query pattern)
        run: |
          curl -sS --max-time 20 -A "compstrength-diagnostic/1.0 (contact: github.com/Specifxx/CompStrength)" \
            "https://lol.fandom.com/api.php?action=cargoquery&format=json&tables=ScoreboardGames&fields=ScoreboardGames.GameId=GameId,ScoreboardGames.Team1=Team1,ScoreboardGames.Team2=Team2,ScoreboardGames.WinTeam=WinTeam,ScoreboardGames.DateTime_UTC=DateTimeUTC,ScoreboardGames.Patch=Patch,ScoreboardGames.Tournament=Tournament&order_by=ScoreboardGames.DateTime_UTC%20DESC&limit=2" \
            | head -c 3000
          echo

      - name: Leaguepedia -- ScoreboardPlayers for the same recent game
        run: |
          sleep 4
          curl -sS --max-time 20 -A "compstrength-diagnostic/1.0 (contact: github.com/Specifxx/CompStrength)" \
            "https://lol.fandom.com/api.php?action=cargoquery&format=json&tables=ScoreboardPlayers&fields=ScoreboardPlayers.GameId=GameId,ScoreboardPlayers.Link=Link,ScoreboardPlayers.Champion=Champion,ScoreboardPlayers.Side=Side,ScoreboardPlayers.Role=Role,ScoreboardPlayers.PlayerWin=PlayerWin,ScoreboardPlayers.Team=Team&where=ScoreboardPlayers.GameId=%222026%20Mid-Season%20Invitational_Play-In%20Day%204_1_3%22&limit=15" \
            | head -c 4000
          echo

      - name: Leaguepedia -- PicksAndBansS7 for the same game
        run: |
          sleep 4
          curl -sS --max-time 20 -A "compstrength-diagnostic/1.0 (contact: github.com/Specifxx/CompStrength)" \
            "https://lol.fandom.com/api.php?action=cargoquery&format=json&tables=PicksAndBansS7&fields=PicksAndBansS7.GameId=GameId,PicksAndBansS7.Team1Ban1=Team1Ban1,PicksAndBansS7.Team1Pick1=Team1Pick1,PicksAndBansS7.Team2Ban1=Team2Ban1,PicksAndBansS7.Team2Pick1=Team2Pick1&where=PicksAndBansS7.GameId=%222026%20Mid-Season%20Invitational_Play-In%20Day%204_1_3%22&limit=3" \
            | head -c 3000
          echo

      - name: Leaguepedia -- count of recent games available (last 45 days, all tournaments)
        run: |
          sleep 4
          curl -sS --max-time 20 -A "compstrength-diagnostic/1.0 (contact: github.com/Specifxx/CompStrength)" \
            "https://lol.fandom.com/api.php?action=cargoquery&format=json&tables=ScoreboardGames&fields=ScoreboardGames.GameId=GameId,ScoreboardGames.DateTime_UTC=DateTimeUTC,ScoreboardGames.Tournament=Tournament&where=ScoreboardGames.DateTime_UTC%20%3E%3D%20%222026-05-17%22&order_by=ScoreboardGames.DateTime_UTC%20DESC&limit=10" \
            | head -c 3000
          echo
