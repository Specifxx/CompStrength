name: Refresh Data

# Keeps data/champion_ratings.json and data/model.json up to date by running
# the Python pipeline on a schedule and pushing any changes back to the
# default branch. Vercel watches this branch, so a push here triggers an
# automatic redeploy of the site with fresh data.
#
# Runs against --source leaguepedia (real, current pro match data fetched
# live from Leaguepedia's Cargo API) rather than the bundled synthetic
# fixture -- this only works from an environment with normal network
# access (GitHub Actions), not the dev sandbox this was built in.

on:
  schedule:
    # 04:17 UTC daily — off-peak, and offset from the hour to avoid the
    # top-of-hour crunch on GitHub Actions' shared cron scheduler.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      target_games:
        description: >-
          Override the number of most-recent games to fetch (default: 1000,
          PipelineConfig.target_training_games). Useful for a quick, smaller
          smoke test of the live Leaguepedia fetch before a full-size run.
        required: false
        type: string

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Leaguepedia's Cargo API rate-limits aggressively; the fetcher retries
    # with backoff, but bound the whole job so a pathological run fails
    # cleanly instead of running for hours.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Default GITHUB_TOKEN is sufficient since we only need to push to
          # this same repo, and the job has contents:write permission above.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/pipeline

      - name: Run data pipeline (real, live match data from Leaguepedia)
        env:
          COMPSTRENGTH_TARGET_GAMES: ${{ github.event.inputs.target_games }}
        run: python -m compstrength_pipeline.build --source leaguepedia

      - name: Check for data changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated data
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/champion_ratings.json data/model.json data/synergy.json data/backtest_report.json
          git commit -m "chore: refresh champion ratings and model data [skip ci]"
          git push
