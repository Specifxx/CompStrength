name: Diagnose Real Data Sources

# Fast, targeted re-check of Leaguepedia Cargo API behavior after the live
# refresh-data.yml smoke test exhausted all retries on a ScoreboardPlayers
# "GameId IN (...)" batch query (while the earlier plain ScoreboardGames
# query succeeded). Low retry/short timeouts so this fails fast instead of
# taking 15 minutes, to distinguish "still IP-blocked entirely" from
# "specifically the IN-clause/batch query is the trigger".

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Simple ScoreboardGames query (no IN clause, known-good shape)
        run: |
          curl -sS --max-time 15 -A "compstrength-diagnostic/1.0 (contact: github.com/Specifxx/CompStrength)" \
            "https://lol.fandom.com/api.php?action=cargoquery&format=json&tables=ScoreboardGames&fields=ScoreboardGames.GameId=GameId,ScoreboardGames.DateTime_UTC=DateTimeUTC&order_by=ScoreboardGames.DateTime_UTC%20DESC&limit=3"
          echo

      - name: Wait 15s
        run: sleep 15

      - name: Tiny ScoreboardPlayers IN-clause query (2 game ids)
        run: |
          curl -sS --max-time 15 -A "compstrength-diagnostic/1.0 (contact: github.com/Specifxx/CompStrength)" \
            'https://lol.fandom.com/api.php?action=cargoquery&format=json&tables=ScoreboardPlayers&fields=ScoreboardPlayers.GameId=GameId,ScoreboardPlayers.Champion=Champion&where=ScoreboardPlayers.GameId%20IN%20(%222026%20Mid-Season%20Invitational_Play-In%20Day%204_1_3%22,%222026%20Mid-Season%20Invitational_Play-In%20Day%204_1_2%22)&limit=20'
          echo

      - name: Wait 15s
        run: sleep 15

      - name: Larger ScoreboardPlayers IN-clause query (10 game ids, closer to production chunk_size)
        run: |
          IDS='"2026 Mid-Season Invitational_Play-In Day 4_1_3","2026 Mid-Season Invitational_Play-In Day 4_1_2","2026 Mid-Season Invitational_Play-In Day 4_1_1"'
          curl -sS --max-time 15 -A "compstrength-diagnostic/1.0 (contact: github.com/Specifxx/CompStrength)" \
            --data-urlencode "action=cargoquery" \
            --data-urlencode "format=json" \
            --data-urlencode "tables=ScoreboardPlayers" \
            --data-urlencode "fields=ScoreboardPlayers.GameId=GameId,ScoreboardPlayers.Champion=Champion" \
            --data-urlencode "where=ScoreboardPlayers.GameId IN ($IDS)" \
            --data-urlencode "limit=50" \
            "https://lol.fandom.com/api.php"
          echo

      - name: Simple ScoreboardGames query again (bookend check -- did the earlier calls make things worse?)
        run: |
          sleep 15
          curl -sS --max-time 15 -A "compstrength-diagnostic/1.0 (contact: github.com/Specifxx/CompStrength)" \
            "https://lol.fandom.com/api.php?action=cargoquery&format=json&tables=ScoreboardGames&fields=ScoreboardGames.GameId=GameId&order_by=ScoreboardGames.DateTime_UTC%20DESC&limit=1"
          echo
