name: Refresh Data

# Keeps data/champion_ratings.json and data/model.json up to date by running
# the Python pipeline on a schedule and pushing any changes back to the
# default branch. Vercel watches this branch, so a push here triggers an
# automatic redeploy of the site with fresh data.
#
# Runs against --source oracles-elixir: it downloads Oracle's Elixir's bulk
# season CSV (thousands of real pro games, one file) from Google Drive. This
# is far more robust for a daily cron than Leaguepedia's Cargo API, which
# rate-limits aggressively on shared CI IPs (a single bulk download has no
# per-request throttle). Only works from an environment with normal network
# access (GitHub Actions), not the dev sandbox this was built in.

on:
  schedule:
    # 04:17 UTC daily — off-peak, and offset from the hour to avoid the
    # top-of-hour crunch on GitHub Actions' shared cron scheduler.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      target_games:
        description: >-
          Override the number of most-recent games to fetch (default: 1000,
          PipelineConfig.target_training_games). Useful for a quick, smaller
          smoke test of the live Leaguepedia fetch before a full-size run.
        required: false
        type: string

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Leaguepedia's Cargo API rate-limits aggressively; the fetcher retries
    # with backoff, but bound the whole job so a pathological run fails
    # cleanly instead of running for hours.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Default GITHUB_TOKEN is sufficient since we only need to push to
          # this same repo, and the job has contents:write permission above.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/pipeline

      # Past-season Oracle's Elixir CSVs are frozen once the season ends, but
      # the shared Google Drive files are frequently over Google's per-file
      # download quota ("too many users..."). Cache each past season's CSV the
      # first time ANY daily run manages to download it; every later run then
      # reuses the cached copy instead of gambling on Drive quota. The key is
      # unique per run and restore-keys picks the newest previous cache, so
      # the cache "ratchets": an empty first save is later replaced by a
      # populated one as soon as one download succeeds. The CURRENT season's
      # file updates daily and is deliberately never cached (see
      # sources/oracles_elixir.py).
      - name: Cache past-season Oracle's Elixir CSVs
        uses: actions/cache@v4
        with:
          path: ~/.cache/compstrength-oe
          key: oe-past-seasons-${{ github.run_id }}
          restore-keys: |
            oe-past-seasons-

      - name: Run data pipeline (real match data from Oracle's Elixir bulk CSV)
        env:
          COMPSTRENGTH_TARGET_GAMES: ${{ github.event.inputs.target_games }}
          COMPSTRENGTH_OE_CACHE_DIR: ~/.cache/compstrength-oe
        run: python -m compstrength_pipeline.build --source oracles-elixir

      - name: Check for data changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated data
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/champion_ratings.json data/model.json data/synergy.json data/backtest_report.json
          git commit -m "chore: refresh champion ratings and model data [skip ci]"
          git push
