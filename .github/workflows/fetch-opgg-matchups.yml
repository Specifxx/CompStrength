name: Fetch opgg Matchup Tables

# One-shot (workflow_dispatch): harvest op.gg's full solo-queue matchup
# tables -- for every champion x position x available patch, the per-opponent
# [play, win] counter records (emerald+, global) -- and publish them to the
# data-cache branch. Feeds the "solo matchup prior for pro counter-picks"
# experiment: pro lane-matchup samples are tiny (a specific pair recurs a
# handful of times), while solo queue has thousands of games per pair,
# including off-meta pairs pro data has never seen.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Harvest matchup tables
        run: |
          mkdir -p /tmp/staging
          python - <<'EOF'
          import gzip
          import json
          import time
          import urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (research; compstrength)"}
          POSITIONS = ["TOP", "JUNGLE", "MID", "ADC", "SUPPORT"]

          def get_json(url, timeout=30):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read())

          # Champion id -> name from Data Dragon (key field is the numeric id).
          versions = get_json("https://ddragon.leagueoflegends.com/api/versions.json")
          champs = get_json(
              f"https://ddragon.leagueoflegends.com/cdn/{versions[0]}/data/en_US/champion.json"
          )["data"]
          id_to_name = {int(v["key"]): v["name"] for v in champs.values()}
          print(f"ddragon: {len(id_to_name)} champions (v{versions[0]})")

          patches = get_json(
              "https://lol-api-champion.op.gg/api/global/champions/ranked/versions"
          )["data"]
          print(f"op.gg patches available: {patches}")

          for version in patches:
              table = {}
              requested = 0
              hits = 0
              for cid in sorted(id_to_name):
                  for pos in POSITIONS:
                      url = (
                          f"https://lol-api-champion.op.gg/api/global/champions/ranked/"
                          f"{cid}/{pos}?tier=emerald_plus&version={version}"
                      )
                      requested += 1
                      try:
                          data = get_json(url)["data"]
                      except Exception:
                          time.sleep(0.1)
                          continue
                      counters = data.get("counters") or []
                      summary = data.get("summary") or {}
                      if counters:
                          hits += 1
                          table.setdefault(str(cid), {})[pos] = {
                              "play": summary.get("play"),
                              "win": summary.get("win"),
                              "counters": [
                                  [c["champion_id"], c["play"], c["win"]]
                                  for c in counters
                              ],
                          }
                      time.sleep(0.15)
                  if requested % 100 < 5:
                      print(f"  ...{requested} requests, {hits} tables", flush=True)
              out = {
                  "version": version,
                  "region": "global",
                  "tier": "emerald_plus",
                  "fetchedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "idToName": id_to_name,
                  "champions": table,
              }
              path = f"/tmp/staging/opgg_matchups_{version}.json.gz"
              with gzip.open(path, "wb", compresslevel=9) as f:
                  f.write(json.dumps(out, separators=(",", ":")).encode())
              print(f"wrote {path}: {hits} champion-position tables")
          EOF

      - name: Publish to data-cache branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -la /tmp/staging/
          git fetch origin data-cache
          git worktree add /tmp/data-cache origin/data-cache
          cd /tmp/data-cache
          git checkout -b data-cache
          cp /tmp/staging/* .
          git add -A
          git commit -m "Add op.gg solo-queue matchup tables (per champion x position x patch)"
          git push --force-with-lease origin data-cache
