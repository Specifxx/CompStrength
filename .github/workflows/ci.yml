name: CI

# Basic sanity checks so breakage in either the frontend or the pipeline is
# caught on every push/PR, before it can reach production.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  pipeline:
    name: Pipeline (tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/pipeline
          pip install pytest

      - name: Run tests
        run: python -m pytest packages/pipeline/tests
