name: Probe OPGG SoloQ Champion API

# One-shot (workflow_dispatch) verification probe: OP.GG's internal champion
# API (lol-api-champion.op.gg) is proxy-blocked in the dev sandbox, so this
# fetches its versions list + per-patch champion winrates from Actions
# (unrestricted egress) and publishes the evidence to an orphan
# `probe-opgg-results` branch the sandbox can `git fetch`.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run probe
        run: python .github/probe-opgg/probe.py

      - name: Publish results to probe-opgg-results branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-opgg-results
          git rm -rf --quiet . || true
          cp -r /tmp/opgg_probe/. .
          git add -A
          git commit -m "OP.GG solo-queue API probe results"
          git push --force origin probe-opgg-results
